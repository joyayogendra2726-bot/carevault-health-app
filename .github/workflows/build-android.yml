name: Build CareVault Android AAB & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify & auto-fix www folder structure
        run: |
          mkdir -p www/assets
          [ -f "index.html" ] && [ ! -f "www/index.html" ] && mv index.html www/index.html
          [ -f "manifest.json" ] && [ ! -f "www/manifest.json" ] && mv manifest.json www/manifest.json
          [ -f "sw.js" ] && [ ! -f "www/sw.js" ] && mv sw.js www/sw.js
          [ -f "icon-512.png" ] && [ ! -f "www/assets/icon-512.png" ] && mv icon-512.png www/assets/icon-512.png
          [ -f "welcome-3d.png" ] && [ ! -f "www/assets/welcome-3d.png" ] && mv welcome-3d.png www/assets/welcome-3d.png
          [ -f "alarm_ring.wav" ] && [ ! -f "www/assets/alarm_ring.wav" ] && mv alarm_ring.wav www/assets/alarm_ring.wav
          test -f www/index.html || (echo "ERROR: www/index.html is missing!" && exit 1)

      - name: Add and sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html || (echo "ERROR: public/index.html missing after cap sync!" && exit 1)

      - name: Configure SDK versions (API 35 & minSdk 24)
        run: |
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.9.2'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.15.0'
              androidxFragmentVersion = '1.8.4'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '13.0.0'
          }
          EOF

      - name: Patch AndroidManifest.xml permissions
        run: |
          python3 - << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p) as f:
              s = f.read()
          perms = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="com.android.vending.BILLING" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]
          missing = "\n    ".join(x for x in perms if x not in s)
          if missing:
              s = s.replace("<application", f"    {missing}\n    <application", 1)
          with open(p, "w") as f:
              f.write(s)
          PYEOF

      - name: Bundle loud alarm sound in Android res/raw
        run: |
          mkdir -p android/app/src/main/res/raw
          [ -f "www/assets/alarm_ring.wav" ] && cp www/assets/alarm_ring.wav android/app/src/main/res/raw/alarm_ring.wav || true

      - name: Apply custom 512x512 app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp www/assets/icon-512.png "android/app/src/main/res/$dir/ic_launcher.png"
            cp www/assets/icon-512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
          done

      - name: Prepare fixed signing keystore
        run: |
          if [ ! -f "release-key.jks" ]; then
            keytool -genkeypair -v -keystore release-key.jks -alias carevault -keyalg RSA -keysize 2048 -validity 10000 -storepass CareVault2026! -keypass CareVault2026! -dname "CN=CareVault, OU=Mobile, O=CareVault, L=Ahmedabad, ST=Gujarat, C=IN"
          fi
          keytool -export -rfc -keystore release-key.jks -alias carevault -storepass CareVault2026! -file upload_certificate.pem
          cp release-key.jks android/app/release-key.jks

      - name: Configure Gradle signing
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword "CareVault2026!"
                      keyAlias "carevault"
                      keyPassword "CareVault2026!"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Generate loud native alarm WAV sound
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - << 'PYEOF'
          import wave, struct, math
          sr = 22050
          dur = 2.4
          with wave.open("android/app/src/main/res/raw/carevault_alarm.wav", "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              frames = bytearray()
              for i in range(int(sr * dur)):
                  t = i / sr
                  # 4 loud urgent pulses (0.3s on, 0.3s off)
                  if (t % 0.6) < 0.32:
                      val = 0.85 * (math.sin(2 * math.pi * 880 * t) + 0.5 * math.sin(2 * math.pi * 1320 * t)) / 1.5
                  else:
                      val = 0.0
                  frames += struct.pack("<h", int(max(-1.0, min(1.0, val)) * 32767))
              wf.writeframes(frames)
          PYEOF

      - name: Build Debug APK and Signed Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carevault-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            upload_certificate.pem
